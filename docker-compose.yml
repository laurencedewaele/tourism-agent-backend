# Lance l'ensemble : PostgreSQL + backend FastAPI + frontend Gradio.
# Le repo tourism-agent-frontend doit être cloné à côté de ce repo (../tourism-agent-frontend).
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourism}
      POSTGRES_DB: ${POSTGRES_DB:-tourism}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourism} -d ${POSTGRES_DB:-tourism}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tourism}:${POSTGRES_PASSWORD:-tourism}@db:5432/${POSTGRES_DB:-tourism}
      CORS_ORIGINS: http://localhost:7860
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../tourism-agent-frontend
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_API_KEY: ${API_KEY:-}
    ports:
      - "7860:7860"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
