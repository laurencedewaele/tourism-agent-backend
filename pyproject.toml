[project]
name = "tourism-agent-backend"
version = "0.1.0"
description = "Backend FastAPI exposant l'agent LangGraph de recherche de séjours"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langchain-openai>=1.6.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "uvicorn[standard]>=0.41.0",
]

[project.scripts]
tourism-api = "tourism_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Deux paquets : l'agent LangGraph et la couche HTTP FastAPI
packages = ["src/tourism_agent", "src/tourism_api"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: tests nécessitant une base PostgreSQL (DATABASE_URL)",
]
